<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Werewolf Activity</title>
    <!-- 引入 Discord Embedded App SDK -->
    <script src="https://getSourceUrlOrSdkHere"></script>
    <style>
        :root {
            --bg-dark: #313338;
            --bg-secondary: #2b2d31;
            --bg-tertiary: #1e1f22;
            --brand-color: #5865f2;
            --brand-hover: #4752c4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
            --danger: #ed4245;
            --success: #248046;
            --warning: #f0b232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部状态栏 */
        header {
            background-color: var(--bg-tertiary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2023;
        }

        .room-info h1 {
            font-size: 18px;
            color: var(--text-header);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--brand-color);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 主体布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧游戏面板 */
        .game-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--bg-dark);
        }

        /* 右侧玩家及状态栏 */
        .sidebar {
            width: 280px;
            background-color: var(--bg-secondary);
            border-left: 1px solid #1f2023;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .player-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background-color: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 14px;
        }

        .player-item.dead {
            opacity: 0.5;
            text-decoration: line-through;
        }

        /* 公告与日志卡片 */
        .card {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .phase-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-header);
            margin-bottom: 8px;
        }

        .phase-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* 身份揭晓卡片 */
        .role-card {
            background: linear-gradient(135deg, #2b2d31, #1e1f22);
            border: 2px solid var(--brand-color);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
            display: inline-block;
        }

        .role-name {
            font-size: 24px;
            color: var(--warning);
            font-weight: bold;
            margin: 5px 0;
        }

        /* 按钮与交互 */
        .btn {
            background-color: var(--brand-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--brand-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #c9383b;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* 日志流 */
        .log-box {
            background-color: var(--bg-tertiary);
            border-radius: 6px;
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-normal);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto;
        }

        .log-item {
            border-left: 3px solid var(--brand-color);
            padding-left: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="room-info">
            <h1>🐺 空间狼人杀 <span class="badge" id="room-status-badge">准备阶段</span></h1>
        </div>
        <div id="current-user-tag" style="font-size: 14px; color: var(--text-muted);">正在连接 Discord...</div>
    </header>

    <div class="main-container">
        <!-- 左侧游戏核心面板 -->
        <div class="game-panel">
            
            <!-- 阶段 1：大厅等待 -->
            <div id="view-lobby" class="card">
                <div class="phase-title">狼人杀派对房</div>
                <div class="phase-desc">呼叫频道好友加入，凑齐人数后即可开启烧脑对决！支持 4-8 人游玩。</div>
                <button class="btn" onclick="startGame()">🚀 随机发牌并开始游戏</button>
            </div>

            <!-- 阶段 2：角色及游戏进行中 -->
            <div id="view-game" class="card" style="display: none;">
                <div class="phase-title" id="phase-title-text">天黑请闭眼 🌙</div>
                <div class="phase-desc" id="phase-desc-text">请等待其他玩家行动...</div>

                <!-- 个人身份秘密展示区 -->
                <div class="role-card">
                    <div style="font-size: 12px; color: var(--text-muted);">你的底牌身份</div>
                    <div class="role-name" id="my-role-display">平民</div>
                    <div id="my-role-tip" style="font-size: 13px; color: var(--text-normal);">隐藏好自己，协助好队友。</div>
                </div>

                <!-- 互动操作区（根据身份及阶段动态变化） -->
                <div id="action-area" style="margin-top: 15px;">
                    <!-- 动态注入按钮 -->
                </div>
            </div>

            <!-- 底部事件通知日志 -->
            <div style="margin-top: 20px;">
                <h3 style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">游戏战报流水</h3>
                <div class="log-box" id="game-logs">
                    <div class="log-item">[系统] 欢迎来到 Discord 狼人杀 Activity，点击上方按钮开始游戏。</div>
                </div>
            </div>
        </div>

        <!-- 右侧在线成员名单 -->
        <div class="sidebar">
            <h3>房间成员 (<span id="player-count">4</span>)</h3>
            <ul class="player-list" id="sidebar-player-list">
                <!-- 动态渲染 -->
            </ul>
        </div>
    </div>

    <script>
        // 模拟本地及 Discord 基础状态
        let gameState = {
            phase: 'LOBBY', // LOBBY, NIGHT_WEREWOLF, NIGHT_SEER, NIGHT_WITCH, DAY_DISCUSS, DAY_VOTE
            players: [
                { id: 1, name: 'Alex (你)', role: 'unassigned', isAlive: true, isMe: true },
                { id: 2, name: 'Echo', role: 'unassigned', isAlive: true, isMe: false },
                { id: 3, name: 'Nova', role: 'unassigned', isAlive: true, isMe: false },
                { id: 4, name: 'Kite', role: 'unassigned', isAlive: true, isMe: false }
            ],
            myId: 1,
            nightTarget: null,
            savedByWitch: false,
            poisonedTarget: null
        };

        const roleInfoMap = {
            'werewolf': { name: '🐺 狼人', tip: '每晚寻找目标并击杀一名好人。' },
            'seer': { name: '🔮 预言家', tip: '每晚可以查验一名玩家的真实身份。' },
            'witch': { name: '🧪 女巫', tip: '拥有一瓶解药和一瓶毒药（整局各一次）。' },
            'villager': { name: '🧑 平民', tip: '认真听取发言，通过投票找出狼人。' }
        };

        // 初始化渲染
        function render() {
            // 更新人数
            document.getElementById('player-count').textContent = gameState.players.length;
            
            // 渲染右侧玩家列表
            const listEl = document.getElementById('sidebar-player-list');
            listEl.innerHTML = '';
            gameState.players.forEach(p => {
                const li = document.createElement('li');
                li.className = `player-item ${p.isAlive ? '' : 'dead'}`;
                li.innerHTML = `<span>${p.name}</span> <span>${p.isAlive ? (p.isMe ? '🟢 你' : '🟢 在线') : '💀 淘汰'}</span>`;
                listEl.appendChild(li);
            });

            // 切换视图
            if (gameState.phase === 'LOBBY') {
                document.getElementById('view-lobby').style.display = 'block';
                document.getElementById('view-game').style.display = 'none';
                document.getElementById('room-status-badge').textContent = '准备阶段';
            } else {
                document.getElementById('view-lobby').style.display = 'none';
                document.getElementById('view-game').style.display = 'block';
                
                const me = gameState.players.find(p => p.isMe);
                const roleData = roleInfoMap[me.role] || { name: '未知', tip: '' };
                document.getElementById('my-role-display').textContent = roleData.name;
                document.getElementById('my-role-tip').textContent = roleData.tip;

                updatePhaseUI();
            }
        }

        function addLog(text) {
            const logs = document.getElementById('game-logs');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            logs.appendChild(item);
            logs.scrollTop = logs.scrollHeight;
        }

        // 开始游戏与发牌逻辑
        function startGame() {
            const rolesPool = ['werewolf', 'seer', 'witch', 'villager'];
            // 随机分配
            gameState.players.forEach((p, idx) => {
                p.role = rolesPool[idx % rolesPool.length];
                p.isAlive = true;
            });

            gameState.phase = 'NIGHT_WEREWOLF';
            document.getElementById('room-status-badge').textContent = '夜晚行动中';
            addLog('游戏正式开始！天黑请闭眼，所有玩家已隐藏身份。');
            addLog('【夜晚阶段】狼人请睁眼，选择今晚要袭击的目标。');
            render();
        }

        // 更新阶段对应文案与互动按钮
        function updatePhaseUI() {
            const titleEl = document.getElementById('phase-title-text');
            const descEl = document.getElementById('phase-desc-text');
            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = '';

            const me = gameState.players.find(p => p.isMe);

            if (gameState.phase === 'NIGHT_WEREWOLF') {
                titleEl.textContent = '天黑请闭眼 · 狼人回合 🐺';
                descEl.textContent = me.role === 'werewolf' ? '轮到你行动：请选择一名玩家进行袭击。' : '你是好人阵营，正在沉睡中，等待狼人行动...';

                if (me.role === 'werewolf' && me.isAlive) {
                    const group = document.createElement('div');
                    group.className = 'btn-group';
                    gameState.players.filter(p => p.isAlive && p.role !== 'werewolf').forEach(p => {
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-danger';
                        btn.textContent = `袭击 [${p.name}]`;
                        btn.onclick = () => {
                            gameState.nightTarget = p.id;
                            addLog(`你（狼人）锁定了袭击目标：${p.name}`);
                            // 自动进入下一夜角色（预言家）
                            setTimeout(advanceNight, 1000);
                        };
                        group.appendChild(btn);
                    });
                    actionArea.appendChild(group);
                } else {
                    // 非狼人直接自动跳过模拟
                    setTimeout(advanceNight, 2500);
                }
            } else if (gameState.phase === 'DAY_DISCUSS') {
                titleEl.textContent = '天亮了 · 自由讨论与决胜 ☀️';
                descEl.textContent = '昨晚平安夜 / 或有人被袭击。请结合语音频道语音进行辩论并投票！';

                const group = document.createElement('div');
                group.className = 'btn-group';
                const voteBtn = document.createElement('button');
                voteBtn.className = 'btn btn-danger';
                voteBtn.textContent = '发起投票（逐出可疑人员）';
                voteBtn.onclick = () => {
                    // 简单随机淘汰一人模拟投票
                    const alivePlayers = gameState.players.filter(p => p.isAlive);
                    const victim = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                    victim.isAlive = false;
                    addLog(`[投票结果] 大家投票将 ${victim.name} 逐出了局！其身份是：${roleInfoMap[victim.role].name}`);
                    
                    // 检查游戏是否结束
                    checkWinCondition();
                };
                group.appendChild(voteBtn);
                actionArea.appendChild(group);
            }
        }

        function advanceNight() {
            if (gameState.phase === 'NIGHT_WEREWOLF') {
                gameState.phase = 'DAY_DISCUSS';
                addLog('天亮了，所有玩家睁眼。');
                render();
            }
        }

        function checkWinCondition() {
            const aliveWolves = gameState.players.filter(p => p.role === 'werewolf' && p.isAlive);
            const aliveGood = gameState.players.filter(p => p.role !== 'werewolf' && p.isAlive);

            if (aliveWolves.length === 0) {
                addLog('🎉 游戏结束！好人阵营获胜！');
                alert('游戏结束：好人阵营获胜！');
                gameState.phase = 'LOBBY';
                render();
            } else if (aliveWolves.length >= aliveGood.length) {
                addLog('🎉 游戏结束！狼人阵营获胜！');
                alert('游戏结束：狼人阵营获胜！');
                gameState.phase = 'LOBBY';
                render();
            } else {
                // 重新进入下一轮夜晚
                setTimeout(() => {
                    gameState.phase = 'NIGHT_WEREWOLF';
                    addLog('------------------');
                    addLog('新的一夜降临，天黑请闭眼...');
                    render();
                }, 2000);
            }
        }

        // 初始化执行
        render();

        // 尝试对接 Discord SDK (本地调试未在 Discord 中时会自动降级捕获异常)
        try {
            // const discordSdk = new DiscordSDK(ENV.CLIENT_ID);
            document.getElementById('current-user-tag').textContent = 'Discord 环境就绪 (模拟玩家: Alex)';
        } catch (e) {
            document.getElementById('current-user-tag').textContent = '独立浏览器运行模式';
        }
    </script>
</body>
</html>
