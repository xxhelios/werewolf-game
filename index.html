<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game</title>
    <style>
        :root {
            --bg-dark: #313338;
            --bg-secondary: #2b2d31;
            --bg-tertiary: #1e1f22;
            --brand-color: #5865f2;
            --brand-hover: #4752c4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
            --danger: #ed4245;
            --success: #248046;
            --warning: #f0b232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部状态栏 */
        header {
            background-color: var(--bg-tertiary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2023;
        }

        .room-info h1 {
            font-size: 18px;
            color: var(--text-header);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--brand-color);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 主体布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧游戏面板 */
        .game-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--bg-dark);
        }

        /* 右侧玩家及状态栏 */
        .sidebar {
            width: 280px;
            background-color: var(--bg-secondary);
            border-left: 1px solid #1f2023;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .player-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background-color: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 14px;
        }

        .player-item.dead {
            opacity: 0.5;
            text-decoration: line-through;
        }

        /* 公告与日志卡片 */
        .card {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .phase-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-header);
            margin-bottom: 8px;
        }

        .phase-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* 身份揭晓卡片 */
        .role-card {
            background: linear-gradient(135deg, #2b2d31, #1e1f22);
            border: 2px solid var(--brand-color);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
            display: inline-block;
        }

        .role-name {
            font-size: 24px;
            color: var(--warning);
            font-weight: bold;
            margin: 5px 0;
        }

        /* 按钮与交互 */
        .btn {
            background-color: var(--brand-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--brand-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #c9383b;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* 日志流 */
        .log-box {
            background-color: var(--bg-tertiary);
            border-radius: 6px;
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-normal);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto;
        }

        .log-item {
            border-left: 3px solid var(--brand-color);
            padding-left: 6px;
        }

        .room-code {
            display: inline-block;
            margin: 8px 0 16px;
            padding: 10px 18px;
            border: 1px dashed var(--brand-color);
            border-radius: 8px;
            color: var(--text-header);
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
        }

        .room-entry {
            max-width: 520px;
            margin: auto;
        }

        .room-entry input {
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #4e5058;
            border-radius: 4px;
            background: var(--bg-tertiary);
            color: var(--text-header);
            font-size: 14px;
        }

        .room-entry input:focus {
            outline: 2px solid var(--brand-color);
            outline-offset: 1px;
        }

        .room-entry-form {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .room-error {
            min-height: 20px;
            margin-top: 10px;
            color: var(--danger);
            font-size: 13px;
        }

        .waiting-note {
            margin: 12px 0 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 42%;
                padding: 12px;
            }

            .game-panel {
                padding: 12px;
            }

            .room-entry-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="room-info">
            <h1>🐺 空间狼人杀 <span class="badge" id="room-status-badge">准备阶段</span></h1>
        </div>
        <div id="current-user-tag" style="font-size: 14px; color: var(--text-muted);">正在连接房间服务...</div>
    </header>

    <div class="main-container">
        <!-- 左侧游戏核心面板 -->
        <div class="game-panel">
            
            <div id="room-entry" class="card room-entry">
                <div class="phase-title">加入狼人杀房间</div>
                <div class="phase-desc">创建一个房间并分享房间码，或输入好友分享给你的房间码。</div>
                <label for="player-name-input">你的昵称</label>
                <div class="room-entry-form">
                    <input id="player-name-input" type="text" maxlength="24" placeholder="输入昵称" value="Player">
                    <button class="btn" id="create-room-button" type="button">创建房间</button>
                </div>
                <div class="room-entry-form">
                    <input id="room-code-input" type="text" maxlength="6" placeholder="输入 6 位房间码" aria-label="房间码">
                    <button class="btn" id="join-room-button" type="button">加入房间</button>
                </div>
                <div class="room-error" id="room-entry-error" role="alert"></div>
            </div>

            <!-- 阶段 1：等待玩家加入 -->
            <div id="view-lobby" class="card" style="display: none;">
                <div class="phase-title">等待玩家加入</div>
                <div class="phase-desc">分享房间码给好友。4-8 位玩家可以开始游戏。</div>
                <div class="room-code" id="room-code-display">------</div>
                <div class="btn-group">
                    <button class="btn" id="copy-room-code-button" type="button">复制房间码</button>
                    <button class="btn" id="start-game-button" type="button" onclick="startGame()" disabled>等待玩家 (1/4)</button>
                </div>
                <p class="waiting-note" id="waiting-note">等待房主开始游戏...</p>
                <div class="room-error" id="room-waiting-error" role="alert"></div>
            </div>

            <!-- 阶段 2：角色及游戏进行中 -->
            <div id="view-game" class="card" style="display: none;">
                <div class="phase-title" id="phase-title-text">天黑请闭眼 🌙</div>
                <div class="phase-desc" id="phase-desc-text">请等待其他玩家行动...</div>

                <!-- 个人身份秘密展示区 -->
                <div class="role-card">
                    <div style="font-size: 12px; color: var(--text-muted);">你的底牌身份</div>
                    <div class="role-name" id="my-role-display">平民</div>
                    <div id="my-role-tip" style="font-size: 13px; color: var(--text-normal);">隐藏好自己，协助好队友。</div>
                </div>

                <!-- 互动操作区（根据身份及阶段动态变化） -->
                <div id="action-area" style="margin-top: 15px;">
                    <!-- 动态注入按钮 -->
                </div>
            </div>

            <!-- 底部事件通知日志 -->
            <div style="margin-top: 20px;">
                <h3 style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">游戏战报流水</h3>
                <div class="log-box" id="game-logs">
                    <div class="log-item">[系统] 创建房间或输入房间码加入好友的房间。</div>
                </div>
            </div>
        </div>

        <!-- 右侧在线成员名单 -->
        <div class="sidebar">
            <h3>房间成员 (<span id="player-count">0</span>/8)</h3>
            <ul class="player-list" id="sidebar-player-list">
                <!-- 动态渲染 -->
            </ul>
        </div>
    </div>

    <script>
        let gameState = {
            phase: 'LOBBY',
            players: [],
            myId: null,
            nightTarget: null,
            savedByWitch: false,
            poisonedTarget: null
        };

        const MIN_PLAYERS = 4;
        const MAX_PLAYERS = 8;
        let roomConnection = null;
        let playerId = null;
        let roomCode = null;
        let isHost = false;
        let roomStarted = false;

        const roleInfoMap = {
            'werewolf': { name: '🐺 狼人', tip: '每晚寻找目标并击杀一名好人。' },
            'seer': { name: '🔮 预言家', tip: '每晚可以查验一名玩家的真实身份。' },
            'witch': { name: '🧪 女巫', tip: '拥有一瓶解药和一瓶毒药（整局各一次）。' },
            'villager': { name: '🧑 平民', tip: '认真听取发言，通过投票找出狼人。' }
        };

        function render() {
            document.getElementById('player-count').textContent = gameState.players.length;

            const listEl = document.getElementById('sidebar-player-list');
            listEl.innerHTML = '';
            gameState.players.forEach(p => {
                const li = document.createElement('li');
                li.className = `player-item ${p.isAlive ? '' : 'dead'}`;
                const name = document.createElement('span');
                name.textContent = p.name;
                const status = document.createElement('span');
                status.textContent = p.isAlive ? (p.isMe ? '🟢 你' : '🟢 在线') : '💀 淘汰';
                li.append(name, status);
                listEl.appendChild(li);
            });

            const hasRoom = Boolean(roomCode);
            document.getElementById('room-entry').style.display = hasRoom ? 'none' : 'block';
            document.getElementById('view-lobby').style.display = hasRoom && gameState.phase === 'LOBBY' ? 'block' : 'none';
            document.getElementById('view-game').style.display = hasRoom && gameState.phase !== 'LOBBY' ? 'block' : 'none';

            if (!hasRoom) {
                document.getElementById('room-status-badge').textContent = '未加入房间';
            } else if (gameState.phase === 'LOBBY') {
                updateWaitingRoom();
                document.getElementById('room-status-badge').textContent = '等待玩家';
            } else {
                document.getElementById('room-status-badge').textContent = '游戏进行中';
                const me = gameState.players.find(p => p.isMe);
                const roleData = roleInfoMap[me.role] || { name: '未知', tip: '' };
                document.getElementById('my-role-display').textContent = roleData.name;
                document.getElementById('my-role-tip').textContent = roleData.tip;
                updatePhaseUI();
            }
        }

        function updateWaitingRoom() {
            const count = gameState.players.length;
            const startButton = document.getElementById('start-game-button');
            document.getElementById('room-code-display').textContent = roomCode;
            startButton.disabled = roomStarted || !isHost || count < MIN_PLAYERS;
            startButton.textContent = roomStarted
                ? '本局已开始'
                : count < MIN_PLAYERS
                ? `等待玩家 (${count}/${MIN_PLAYERS})`
                : isHost ? `🚀 开始游戏 (${count}/${MAX_PLAYERS})` : '等待房主开始游戏';
            document.getElementById('waiting-note').textContent = roomStarted
                ? '本局结束后，请刷新页面创建新房间。'
                : isHost
                ? `分享房间码，至少 ${MIN_PLAYERS} 位玩家加入后即可开始。`
                : '已加入房间，等待房主开始游戏...';
        }

        function setRoomError(message) {
            document.getElementById('room-entry-error').textContent = message;
            document.getElementById('room-waiting-error').textContent = message;
        }

        function sendRoomMessage(message) {
            if (!roomConnection || roomConnection.readyState !== WebSocket.OPEN) {
                setRoomError('房间服务未连接，请稍后重试。');
                return;
            }
            roomConnection.send(JSON.stringify(message));
        }

        function getPlayerName() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();
            if (!name) {
                setRoomError('请输入昵称。');
                input.focus();
                return null;
            }
            return name;
        }

        function createRoom() {
            const name = getPlayerName();
            if (name) {
                setRoomError('');
                sendRoomMessage({ type: 'create-room', name });
            }
        }

        function joinRoom() {
            const name = getPlayerName();
            const codeInput = document.getElementById('room-code-input');
            const code = codeInput.value.trim().toUpperCase();
            if (!name) return;
            if (!/^[A-Z0-9]{6}$/.test(code)) {
                setRoomError('请输入有效的 6 位房间码。');
                codeInput.focus();
                return;
            }
            setRoomError('');
            sendRoomMessage({ type: 'join-room', name, code });
        }

        function handleRoomMessage(message) {
            if (message.type === 'connected') {
                playerId = message.playerId;
                document.getElementById('current-user-tag').textContent = '房间服务已连接';
            } else if (message.type === 'room-state') {
                const previousRoomCode = roomCode;
                const previousPlayers = gameState.players;
                roomCode = message.room.code;
                isHost = message.room.hostId === playerId;
                gameState.players = message.room.players.map(player => ({
                    id: player.id,
                    name: player.name,
                    role: 'unassigned',
                    isAlive: true,
                    isMe: player.id === playerId
                }));
                gameState.myId = playerId;
                if (!previousRoomCode) {
                    addLog(`已加入房间 ${roomCode}。`);
                } else {
                    const joinedPlayer = gameState.players.find(player =>
                        !previousPlayers.some(previous => previous.id === player.id)
                    );
                    const leftPlayer = previousPlayers.find(player =>
                        !gameState.players.some(current => current.id === player.id)
                    );
                    if (joinedPlayer) addLog(`${joinedPlayer.name} 加入了房间。`);
                    if (leftPlayer) addLog(`${leftPlayer.name} 离开了房间。`);
                }
                render();
            } else if (message.type === 'game-started') {
                roomStarted = true;
                gameState.players = message.players.map(player => ({
                    ...player,
                    isMe: player.id === playerId
                }));
                gameState.phase = 'NIGHT_WEREWOLF';
                addLog('房主已开始游戏！天黑请闭眼，所有玩家已隐藏身份。');
                addLog('【夜晚阶段】狼人请睁眼，选择今晚要袭击的目标。');
                render();
            } else if (message.type === 'error') {
                setRoomError(message.message);
            }
        }

        function connectToRoomService() {
            if (window.location.protocol === 'file:') {
                document.getElementById('current-user-tag').textContent = '请启动房间服务';
                setRoomError('请先运行 npm start，再通过 http://localhost:3000 打开游戏。');
                return;
            }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            roomConnection = new WebSocket(`${protocol}//${window.location.host}`);
            roomConnection.addEventListener('open', () => {
                document.getElementById('current-user-tag').textContent = '房间服务已连接';
            });
            roomConnection.addEventListener('message', event => {
                let message;
                try {
                    message = JSON.parse(event.data);
                } catch (error) {
                    console.error('Unable to parse room service message.', error);
                    setRoomError('收到无法处理的房间服务消息，请刷新页面重试。');
                    return;
                }
                handleRoomMessage(message);
            });
            roomConnection.addEventListener('close', () => {
                document.getElementById('current-user-tag').textContent = '房间服务已断开';
                if (!roomCode) {
                    setRoomError('无法连接房间服务，请确认服务已启动后刷新页面。');
                } else {
                    document.getElementById('waiting-note').textContent = '与房间服务断开，请刷新页面重新加入。';
                }
            });
            roomConnection.addEventListener('error', () => {
                document.getElementById('current-user-tag').textContent = '房间服务连接失败';
            });
        }

        async function copyRoomCode() {
            try {
                await navigator.clipboard.writeText(roomCode);
                document.getElementById('waiting-note').textContent = '房间码已复制，可以分享给好友。';
            } catch (error) {
                console.error('Unable to copy room code.', error);
                document.getElementById('waiting-note').textContent = '复制失败，请手动选择房间码。';
            }
        }

        // The current game rules are still simulated in each browser; the server synchronizes the room and start event.
        function startGame() {
            if (isHost) sendRoomMessage({ type: 'start-game' });
        }

        function addLog(text) {
            const logs = document.getElementById('game-logs');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            logs.appendChild(item);
            logs.scrollTop = logs.scrollHeight;
        }

        // 更新阶段对应文案与互动按钮
        function updatePhaseUI() {
            const titleEl = document.getElementById('phase-title-text');
            const descEl = document.getElementById('phase-desc-text');
            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = '';

            const me = gameState.players.find(p => p.isMe);

            if (gameState.phase === 'NIGHT_WEREWOLF') {
                titleEl.textContent = '天黑请闭眼 · 狼人回合 🐺';
                descEl.textContent = me.role === 'werewolf' ? '轮到你行动：请选择一名玩家进行袭击。' : '你是好人阵营，正在沉睡中，等待狼人行动...';

                if (me.role === 'werewolf' && me.isAlive) {
                    const group = document.createElement('div');
                    group.className = 'btn-group';
                    gameState.players.filter(p => p.isAlive && p.role !== 'werewolf').forEach(p => {
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-danger';
                        btn.textContent = `袭击 [${p.name}]`;
                        btn.onclick = () => {
                            gameState.nightTarget = p.id;
                            addLog(`你（狼人）锁定了袭击目标：${p.name}`);
                            // 自动进入下一夜角色（预言家）
                            setTimeout(advanceNight, 1000);
                        };
                        group.appendChild(btn);
                    });
                    actionArea.appendChild(group);
                } else {
                    // 非狼人直接自动跳过模拟
                    setTimeout(advanceNight, 2500);
                }
            } else if (gameState.phase === 'DAY_DISCUSS') {
                titleEl.textContent = '天亮了 · 自由讨论与决胜 ☀️';
                descEl.textContent = '昨晚平安夜 / 或有人被袭击。请结合语音频道语音进行辩论并投票！';

                const group = document.createElement('div');
                group.className = 'btn-group';
                const voteBtn = document.createElement('button');
                voteBtn.className = 'btn btn-danger';
                voteBtn.textContent = '发起投票（逐出可疑人员）';
                voteBtn.onclick = () => {
                    // 简单随机淘汰一人模拟投票
                    const alivePlayers = gameState.players.filter(p => p.isAlive);
                    const victim = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                    victim.isAlive = false;
                    addLog(`[投票结果] 大家投票将 ${victim.name} 逐出了局！其身份是：${roleInfoMap[victim.role].name}`);
                    
                    // 检查游戏是否结束
                    checkWinCondition();
                };
                group.appendChild(voteBtn);
                actionArea.appendChild(group);
            }
        }

        function advanceNight() {
            if (gameState.phase === 'NIGHT_WEREWOLF') {
                gameState.phase = 'DAY_DISCUSS';
                addLog('天亮了，所有玩家睁眼。');
                render();
            }
        }

        function checkWinCondition() {
            const aliveWolves = gameState.players.filter(p => p.role === 'werewolf' && p.isAlive);
            const aliveGood = gameState.players.filter(p => p.role !== 'werewolf' && p.isAlive);

            if (aliveWolves.length === 0) {
                addLog('🎉 游戏结束！好人阵营获胜！');
                alert('游戏结束：好人阵营获胜！');
                gameState.phase = 'LOBBY';
                render();
            } else if (aliveWolves.length >= aliveGood.length) {
                addLog('🎉 游戏结束！狼人阵营获胜！');
                alert('游戏结束：狼人阵营获胜！');
                gameState.phase = 'LOBBY';
                render();
            } else {
                // 重新进入下一轮夜晚
                setTimeout(() => {
                    gameState.phase = 'NIGHT_WEREWOLF';
                    addLog('------------------');
                    addLog('新的一夜降临，天黑请闭眼...');
                    render();
                }, 2000);
            }
        }

        render();
        document.getElementById('create-room-button').addEventListener('click', createRoom);
        document.getElementById('join-room-button').addEventListener('click', joinRoom);
        document.getElementById('copy-room-code-button').addEventListener('click', copyRoomCode);
        document.getElementById('room-code-input').addEventListener('input', event => {
            event.target.value = event.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        });
        connectToRoomService();
    </script>
</body>
</html>
